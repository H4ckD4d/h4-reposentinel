[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="h4-reposentinel"
version="0.1.0"
description="Defensive repository and CI/CD configuration audits"
requires-python=">=3.11"
authors=[{name="Chris Cruz (@h4ckd4d)"}]
dependencies=[]
[project.optional-dependencies]
ai=["google-genai>=1.0,<3"]
[project.scripts]
reposentinel="reposentinel.cli:main"
[tool.setuptools.packages.find]
where=["src"]
